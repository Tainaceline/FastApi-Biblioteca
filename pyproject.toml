[project]
name = "biblioteca-fastapi"
version = "0.1.0"
description = ""
authors = [
    {name = "TainaCeline",email = "tainacelinee@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi[standard] (>=0.156.2,<0.157.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.17.1,<0.18.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "taskipy (>=1.14.1,<2.0.0)"
]


[tool.ruff] 
line-length = 79
extend-exclude = ['*.md','migrations'] 

[tool.ruff.lint]
preview = true
select = ['I','F','E','W','PL','PT']

[tool.ruff.format]
preview = true
quote-style = 'single' 

[tool.pytest]
pythonpath = ['.']
addopts = ['-p', 'no:warnings', '--cov=biblicoteca_fastapi', '--cov-context=test']

[tool.typos.files]
extend-exclude = ["*.md", "migrations"]


[tool.poe] 
poetry_command = ""

[tool.poe.tasks]
lint = { cmd = "ruff check ." }
format.sequence = [
  { cmd = "ruff check --fix ." },
  { cmd = "ruff format ." },
]
serve = "fastapi dev biblicoteca_fastapi/app.py"
test.sequence = [
  "lint",
  { cmd = "pytest -s -x --cov=Biblicoteca_fastapi --cov-report=term-missing -vv $POE_EXTRA_ARGS" },
  { cmd = "coverage html --show-contexts" },
]